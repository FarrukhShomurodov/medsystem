name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request replaces that pull request's running workflow (github.ref is
# refs/pull/<n>/merge, one per pull request). Every push to main has a group of its own, the run
# id, so each commit of main runs to the end and keeps its result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PHP_EXTENSIONS: bcmath, gd, intl, pdo_pgsql, zip

jobs:
  assets:
    name: Front-end tests and build (Vitest, Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Page script tests (tests/js)
        run: npm test
      - run: npm run build
      - name: Every file the views load is in the build
        run: node tests/Feature/Frontend/check-manifest.mjs

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
      - uses: ramsey/composer-install@v3
      # Security advisories fail the job; an abandoned package (today a dev dependency of
      # rector-laravel) is listed but does not.
      - name: Composer packages
        run: composer audit --abandoned=report
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # What ships to the browser. The build tools (devDependencies) run on our own files only.
      - name: npm packages that reach the build
        run: npm audit --omit=dev --audit-level=high

  code-style:
    name: Code style (Pint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: composer lint

  static-analysis:
    name: Static analysis (Larastan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
      - uses: ramsey/composer-install@v3
      - name: Larastan (level 8 and paths from phpstan.neon.dist, no baseline)
        run: vendor/bin/phpstan analyse --memory-limit=2G --no-progress --error-format=github
      - name: Rector (nothing left to change)
        run: vendor/bin/rector process --dry-run --no-progress-bar

  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: medsystem_testing
          POSTGRES_USER: medsystem
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medsystem"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: medsystem_testing
      DB_USERNAME: medsystem
      DB_PASSWORD: secret

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: pcov
      - uses: ramsey/composer-install@v3

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Migrations and seeders run on an empty database
        run: php artisan migrate:fresh --seed --force

      # .env.example sets APP_ENV=local, so the demo hospital was seeded: every down() runs over it.
      - name: Every migration rolls back over the demo data and runs again
        run: php artisan migrate:refresh --force

      - name: Test suite
        run: vendor/bin/pest --parallel --coverage --min=40
