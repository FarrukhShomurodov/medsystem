name: Bug report
description: Something in MedSystem does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Report a security vulnerability privately instead, as described in SECURITY.md.
        Never paste real patient data: reproduce the problem with the demo data of a local installation.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, including the full error message or the HTTP status.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The page or endpoint, the account or role you used, and each step.
      placeholder: |
        1. Sign in as the demo cashier.
        2. Open "Касса" and filter by ...
        3. ...
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: The output of `git rev-parse --short HEAD`.
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Docker Compose stack (make up)
        - Local PHP and PostgreSQL
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: The relevant lines of storage/logs/laravel.log. Remove any personal data first.
      render: text
